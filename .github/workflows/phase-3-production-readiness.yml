name: Phase 3 Historical Certification Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-historical-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-3-historical-certification-audit:
    name: Historical Phase 3 certification audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact audit SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out audit SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Exact historical audit SHA mismatch." >&2
            exit 1
          fi
          echo "Historical Phase 3 audit expected SHA: $EXPECTED_SHA"
          echo "Historical Phase 3 audit tested SHA:   $actual_sha"

      - name: Preload Phase 3 disposable fixture images
        shell: bash
        run: |
          set -euo pipefail

          docker version --format '{{.Server.Version}}' >/dev/null

          images=(
            'postgres:16-alpine'
            'redis:7-alpine'
            'minio/minio:RELEASE.2025-09-07T16-13-09Z'
          )

          for image in "${images[@]}"; do
            docker pull "$image"
            image_id="$(docker image inspect "$image" --format '{{.Id}}')"

            if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Invalid local fixture image identity for: $image" >&2
              exit 1
            fi

            echo "Phase 3 fixture image ready: $image"
          done

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run historical Phase 3 certification audit
        run: npm run verify:prd3-g06-final
        env:
          PRD3_G06_EVIDENCE_DIR: ${{ runner.temp }}/prd3-g06

      - name: Upload sanitized historical Phase 3 audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-3-historical-audit-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/prd3-g06/prd3-g06-summary.json
          if-no-files-found: error
          retention-days: 30
