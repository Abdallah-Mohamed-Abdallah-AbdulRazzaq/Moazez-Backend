name: Universal Regression Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional comparison base SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: universal-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-regression:
    name: Blocking aggregate gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      G07_SECURITY_BATCH_SIZE: '3'
      G07_E2E_BATCH_SIZE: '5'
      G07_INTEGRATION_BATCH_SIZE: '5'
      G07_NODE_HEAP_MB: '1536'
      G07_CONTAINER_MEMORY_MB: '2304'
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Exact candidate SHA mismatch." >&2
            exit 1
          fi
          echo "Universal Regression expected SHA: $EXPECTED_SHA"
          echo "Universal Regression tested SHA:   $actual_sha"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve comparison base
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          source_name=""
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              source_name="github.event.pull_request.base.sha"
              ;;
            push)
              base="$PUSH_BASE"
              source_name="github.event.before"
              if [[ "$base" =~ ^0{40}$ ]]; then
                base="$(git rev-parse HEAD^)"
                source_name="github.event.before:all-zero-head-parent-fallback"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$DISPATCH_BASE" ]]; then
                base="$DISPATCH_BASE"
                source_name="github.event.inputs.base_sha"
              else
                base="$(git rev-parse HEAD^)"
                source_name="workflow_dispatch:validated-head-parent-fallback"
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git rev-parse --verify "${base}^{commit}" >/dev/null
          git merge-base "$base" HEAD >/dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "source=$source_name" >> "$GITHUB_OUTPUT"

      - name: Run the current reusable aggregate
        run: npm run test:regression
        env:
          REGRESSION_BASE_SHA: ${{ steps.comparison.outputs.base }}
          REGRESSION_BASE_SOURCE: ${{ steps.comparison.outputs.source }}
          REGRESSION_SUMMARY_PATH: ${{ runner.temp }}/universal-regression-summary.json

      - name: Publish machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-regression-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/universal-regression-summary.json
          if-no-files-found: error
          retention-days: 30
