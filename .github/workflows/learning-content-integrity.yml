name: Learning Content Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-content-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learning-content-integrity:
    name: Lesson Content atomicity and visibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moazez_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: moazez_learning_content
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moazez_ci -d moazez_learning_content"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      APP_PORT: '3000'
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://moazez_ci:ci_only_not_a_secret@127.0.0.1:5432/moazez_learning_content?schema=public
      QUEUE_REDIS_URL: redis://127.0.0.1:6379
      REALTIME_REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_ACCESS_KEY: ci-only-storage-access
      STORAGE_SECRET_KEY: ci-only-storage-secret
      STORAGE_BUCKET: moazez-ci-private
      STORAGE_PUBLIC_BUCKET: moazez-ci-public
      FCM_ENABLED: 'false'
      FCM_DRY_RUN: 'true'
      SEED_DEMO_DATA: 'true'
      LOG_LEVEL: error

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve migration comparison base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_ref="$PR_BASE_SHA"
              ;;
            push)
              if [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                base_ref="$PUSH_BEFORE_SHA"
              else
                base_ref="$(git rev-parse HEAD^)"
              fi
              ;;
            workflow_dispatch)
              default_branch="${DEFAULT_BRANCH:-main}"
              git fetch --no-tags --prune origin \
                "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
              base_ref="origin/${default_branch}"
              ;;
            *)
              echo "Unsupported workflow event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -z "$base_ref" ]]; then
            echo "Unable to resolve a migration comparison base." >&2
            exit 1
          fi

          if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base_ref"
          fi

          git cat-file -e "${base_ref}^{commit}"
          base_commit="$(git rev-parse "${base_ref}^{commit}")"
          echo "MIGRATION_BASE_REF=$base_commit" >> "$GITHUB_ENV"
          echo "Migration governance base: $base_commit"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify supported runtime policy
        run: npm run verify:runtime-policy

      - name: Check migration governance
        run: npm run db:migrations:check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy existing migrations
        run: npm run db:migrations:deploy

      - name: Confirm migration status
        run: npm run db:migrations:status

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed test roles and fixtures
        run: npm run seed

      - name: Build application
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

      - name: Run focused Curriculum and Lesson Content unit contracts
        run: >-
          npx jest --runInBand --runTestsByPath
          src/modules/academics/curriculum/tests/curriculum.use-case.spec.ts
          src/modules/academics/curriculum/tests/lesson-content.use-case.spec.ts
          src/modules/academics/curriculum/tests/lesson-content-publication.use-case.spec.ts
          src/modules/academics/curriculum/tests/lesson-content-publication.controller.spec.ts
          src/modules/academics/curriculum/tests/lesson-content-publication.contract.spec.ts

      - name: Run PostgreSQL Lesson Content integration
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand --runTestsByPath
          test/integration/lesson-content-publication-constraint.integration.spec.ts
          test/integration/lesson-content-publication-atomicity.integration.spec.ts
          test/integration/lesson-content-publication-read-adapters.spec.ts

      - name: Start exact MinIO release
        run: >-
          docker run --detach --rm --name moazez-learning-content-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=ci-only-storage-access
          --env MINIO_ROOT_PASSWORD=ci-only-storage-secret
          --env MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:3001
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs moazez-learning-content-minio
          exit 1

      - name: Run Lesson Content E2E visibility
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand --runTestsByPath
          test/e2e/academics-lesson-content-foundation.e2e-spec.ts
          test/e2e/student-app-lessons.e2e-spec.ts
          test/e2e/parent-app-child-lessons.e2e-spec.ts
          test/e2e/teacher-app-lesson-preparation.e2e-spec.ts

      - name: Run Lesson Content security boundaries
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand --runTestsByPath
          test/security/tenancy.academics-lesson-content.spec.ts
          test/security/tenancy.academics-final-completion.spec.ts
          test/security/tenancy.student-app-lessons.spec.ts
          test/security/tenancy.parent-app-child-lessons.spec.ts
          test/security/tenancy.teacher-app-lesson-preparation.spec.ts

      - name: Stop MinIO
        if: always()
        run: docker rm --force moazez-learning-content-minio || true
