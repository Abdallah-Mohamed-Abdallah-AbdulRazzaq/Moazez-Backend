name: Production backend immutable image

on:
  workflow_dispatch:

concurrency:
  group: production-backend-image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and push the production backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GCP_PROJECT_ID: moazez-production
      REGION: me-central2
      ARTIFACT_REGISTRY_HOST: me-central2-docker.pkg.dev
      ARTIFACT_REGISTRY_REPOSITORY: moazez-production-containers
      ARTIFACT_REGISTRY_PACKAGE: moazez-backend
      IAC_DEPLOYER_SERVICE_ACCOUNT: moazez-iac-deployer@moazez-production.iam.gserviceaccount.com
      IMAGE_PACKAGE: me-central2-docker.pkg.dev/moazez-production/moazez-production-containers/moazez-backend

    steps:
      - name: Check out the exact image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and allowed ref
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Production image creation requires workflow_dispatch." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production image creation is restricted to refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The requested source SHA is invalid." >&2
            exit 1
          fi

          actual_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Exact Production image source SHA mismatch." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: moazez-production
          workload_identity_provider: projects/91001421934/locations/global/workloadIdentityPools/moazez-github-production/providers/moazez-backend-main
          service_account: moazez-iac-deployer@moazez-production.iam.gserviceaccount.com
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: moazez-production

      - name: Verify active authentication context
        shell: bash
        run: |
          set -euo pipefail
          if active_account="$(
            gcloud auth list \
              --filter='status:ACTIVE' \
              --format='value(account)'
          )"; then
            :
          else
            echo "Unable to verify the active Google Cloud account." >&2
            exit 1
          fi
          if [[ "$active_account" != "$IAC_DEPLOYER_SERVICE_ACCOUNT" ]]; then
            echo "Unexpected active Google Cloud account." >&2
            exit 1
          fi

          if active_project="$(gcloud config get-value project)"; then
            :
          else
            echo "Unable to verify the active Google Cloud project." >&2
            exit 1
          fi
          if [[ "$active_project" != "$GCP_PROJECT_ID" ]]; then
            echo "Unexpected active Google Cloud project." >&2
            exit 1
          fi

      - name: Reject an existing immutable source SHA tag
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA_TAG="${IMAGE_PACKAGE}:${EXPECTED_SHA}"
          MANIFEST_URL="https://${ARTIFACT_REGISTRY_HOST}/v2/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${ARTIFACT_REGISTRY_PACKAGE}/manifests/${EXPECTED_SHA}"
          printf 'SOURCE_SHA_TAG=%s\n' "$SOURCE_SHA_TAG"

          token_stderr_file=""
          curl_headers_file=""
          curl_status_file=""
          curl_stderr_file=""
          ACCESS_TOKEN=""
          token_capture=""
          cleanup_lookup_evidence() {
            local cleanup_failed=0
            local evidence_file
            trap - EXIT
            ACCESS_TOKEN=""
            unset ACCESS_TOKEN
            token_capture=""
            unset token_capture
            for evidence_file in \
              "$token_stderr_file" \
              "$curl_headers_file" \
              "$curl_status_file" \
              "$curl_stderr_file"; do
              if [[ -n "$evidence_file" ]]; then
                if ! rm -f -- "$evidence_file"; then
                  cleanup_failed=1
                fi
              fi
            done
            if (( cleanup_failed != 0 )); then
              echo "Unable to remove temporary registry lookup evidence." >&2
              exit 1
            fi
          }
          trap cleanup_lookup_evidence EXIT

          token_stderr_file="$(mktemp)"
          curl_headers_file="$(mktemp)"
          curl_status_file="$(mktemp)"
          curl_stderr_file="$(mktemp)"

          token_exit_code=0
          if token_capture="$(
            gcloud auth print-access-token 2>"$token_stderr_file" &&
              printf '\036'
          )"; then
            :
          else
            token_exit_code=$?
          fi

          if (( token_exit_code != 0 )) ||
            [[ "$token_capture" != *$'\036' ]]; then
            token_capture=""
            unset token_capture
            ACCESS_TOKEN=""
            unset ACCESS_TOKEN
            printf '%s\n' 'TAG_LOOKUP_STATUS=UNEXPECTED_FAILURE' >&2
            printf '%s\n' 'TOKEN_ACQUISITION=FAIL' >&2
            echo "Unable to acquire a valid temporary registry access token." >&2
            exit 1
          fi

          ACCESS_TOKEN="${token_capture%$'\036'}"
          token_capture=""
          unset token_capture
          if [[ "$ACCESS_TOKEN" == *$'\n' ]]; then
            ACCESS_TOKEN="${ACCESS_TOKEN%$'\n'}"
          fi
          if [[ -z "$ACCESS_TOKEN" || "$ACCESS_TOKEN" =~ [[:space:][:cntrl:]] ]]; then
            ACCESS_TOKEN=""
            unset ACCESS_TOKEN
            printf '%s\n' 'TAG_LOOKUP_STATUS=UNEXPECTED_FAILURE' >&2
            printf '%s\n' 'TOKEN_ACQUISITION=FAIL' >&2
            echo "Unable to acquire a valid temporary registry access token." >&2
            exit 1
          fi

          curl_exit_code=0
          if curl \
            --disable \
            --silent \
            --show-error \
            --head \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            --dump-header "$curl_headers_file" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$MANIFEST_URL" \
            >"$curl_status_file" \
            2>"$curl_stderr_file"; then
            :
          else
            curl_exit_code=$?
          fi
          ACCESS_TOKEN=""
          unset ACCESS_TOKEN

          if (( curl_exit_code != 0 )); then
            printf '%s\n' 'TAG_LOOKUP_STATUS=UNEXPECTED_FAILURE' >&2
            printf '%s\n' 'CURL_TRANSPORT_STATUS=FAIL' >&2
            echo "Artifact Registry manifest lookup transport failed." >&2
            exit 1
          fi

          status_contains_nul=0
          if IFS= read -r -d '' status_prefix <"$curl_status_file"; then
            status_contains_nul=1
          fi
          HTTP_STATUS=""
          status_has_extra_byte=0
          if IFS= read -r -N 4 HTTP_STATUS <"$curl_status_file"; then
            status_has_extra_byte=1
          fi
          if (( status_contains_nul != 0 || status_has_extra_byte != 0 )) ||
            [[ ! "$HTTP_STATUS" =~ ^[0-9]{3}$ ]]; then
            printf '%s\n' 'TAG_LOOKUP_STATUS=UNEXPECTED_FAILURE' >&2
            echo "Artifact Registry manifest lookup returned an invalid HTTP status." >&2
            exit 1
          fi

          case "$HTTP_STATUS" in
            404)
              TAG_COLLISION="NO"
              printf 'TAG_COLLISION=%s\n' "$TAG_COLLISION"
              ;;
            200)
              headers_contain_nul=0
              if IFS= read -r -d '' header_prefix <"$curl_headers_file"; then
                headers_contain_nul=1
              fi
              if (( headers_contain_nul != 0 )); then
                printf '%s\n' 'TAG_LOOKUP_STATUS=UNEXPECTED_FAILURE' >&2
                echo "Artifact Registry manifest response contained invalid digest evidence." >&2
                exit 1
              fi

              digest_headers=()
              while IFS= read -r header_line || [[ -n "$header_line" ]]; do
                header_line="${header_line%$'\r'}"
                if [[ "${header_line,,}" == docker-content-digest:* ]]; then
                  digest_value="${header_line#*:}"
                  digest_value="${digest_value#"${digest_value%%[![:space:]]*}"}"
                  digest_value="${digest_value%"${digest_value##*[![:space:]]}"}"
                  digest_headers+=("$digest_value")
                fi
              done <"$curl_headers_file"

              if (( ${#digest_headers[@]} != 1 )) ||
                [[ ! "${digest_headers[0]-}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                printf '%s\n' 'TAG_LOOKUP_STATUS=UNEXPECTED_FAILURE' >&2
                echo "Artifact Registry manifest response contained invalid digest evidence." >&2
                exit 1
              fi

              TAG_COLLISION="YES"
              printf 'TAG_COLLISION=%s\n' "$TAG_COLLISION"
              printf '%s\n' 'BUILD_AUTHORIZED=NO'
              echo "The immutable source SHA tag already exists; overwrite is forbidden." >&2
              exit 1
              ;;
            *)
              printf '%s\n' 'TAG_LOOKUP_STATUS=UNEXPECTED_FAILURE' >&2
              printf 'Artifact Registry manifest lookup returned unexpected HTTP status %s.\n' "$HTTP_STATUS" >&2
              exit 1
              ;;
          esac

      - name: Configure the regional Artifact Registry credential helper
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$ARTIFACT_REGISTRY_HOST" --quiet

      - name: Build the exact source SHA image
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_PACKAGE}:${EXPECTED_SHA}"
          docker build \
            --file Dockerfile \
            --target final \
            --tag "$image_tag" \
            .

      - name: Verify the local built artifact
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_PACKAGE}:${EXPECTED_SHA}"
          if node_version="$(docker run --rm "$image_tag" node --version)"; then
            :
          else
            echo "The local image Node runtime check failed." >&2
            exit 1
          fi
          if [[ "$node_version" != "v22.23.1" ]]; then
            echo "The local image Node runtime version is invalid." >&2
            exit 1
          fi

          docker run --rm "$image_tag" node scripts/verify-media-runtime.cjs

      - name: Push the exact source SHA image
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_PACKAGE}:${EXPECTED_SHA}"
          docker push "$image_tag"

      - name: Resolve the authoritative remote digest
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA_TAG="${IMAGE_PACKAGE}:${EXPECTED_SHA}"
          if RESOLVED_DIGEST="$(
            gcloud artifacts docker images describe \
              "$SOURCE_SHA_TAG" \
              --format='value(image_summary.digest)'
          )"; then
            :
          else
            echo "Authoritative remote digest resolution failed." >&2
            exit 1
          fi

          if [[ ! "$RESOLVED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "The authoritative remote digest is invalid or non-unique." >&2
            exit 1
          fi

          IMMUTABLE_IMAGE_REFERENCE="${IMAGE_PACKAGE}@${RESOLVED_DIGEST}"
          if [[ ! "$IMMUTABLE_IMAGE_REFERENCE" =~ ^me-central2-docker[.]pkg[.]dev/moazez-production/moazez-production-containers/moazez-backend@sha256:[a-f0-9]{64}$ ]]; then
            echo "The immutable Production image reference is invalid." >&2
            exit 1
          fi

          printf 'SOURCE_SHA=%s\n' "$EXPECTED_SHA"
          printf 'IMAGE_PACKAGE=%s\n' "$IMAGE_PACKAGE"
          printf 'SOURCE_SHA_TAG=%s\n' "$SOURCE_SHA_TAG"
          printf 'RESOLVED_DIGEST=%s\n' "$RESOLVED_DIGEST"
          printf 'IMMUTABLE_IMAGE_REFERENCE=%s\n' "$IMMUTABLE_IMAGE_REFERENCE"
